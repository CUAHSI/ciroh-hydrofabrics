[workspace]
authors = ["igarousi <irene.garousi.nejad@gmail.com>"]
channels = ["conda-forge"]
name = "Codes"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
jupyterlab = ">=4.5.6,<5"
ipykernel = ">=7.2.0,<8"
pandas = ">=3.0.2,<4"
geopandas = ">=1.1.3,<2"
shapely = ">=2.1.2,<3"
pyogrio = ">=0.11.1,<0.12"
folium = ">=0.20.0,<0.21"
mapclassify = ">=2.10.0,<3"
matplotlib = ">=3.10.8,<4"
pynhd = ">=0.20.0,<0.21"
pygeohydro = ">=0.14.0,<0.15"
pyyaml = ">=6.0,<7"
fiona = ">=1.10.1,<2"
pytest = ">=8.0,<9"

[pypi-dependencies]
dvc-s3 = ">=3.3.0, <4"
awscli = ">=1.45.0, <2"

[feature.consistency]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[feature.consistency.dependencies]
python = "3.11.*"
geopandas = ">=1.1.3,<2"
shapely = ">=2.1.2,<3"
pyogrio = ">=0.11.1,<0.12"
pyyaml = ">=6.0,<7"
pytest = ">=8.0,<9"

[feature.consistency.tasks]
consistency-check = "python validation/consistency/consistency_check.py"

[environments]
consistency = { features = ["consistency"], no-default-feature = true }
