stages:
  prepare:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/prepare_reference_gpkg.sh
        ${item.id}
        /ngen-workflow/data/superconus/v2.3/divides/vpuid_${item.id}.parquet
        /ngen-workflow/data/superconus/v2.3/flowpaths/vpuid_${item.id}.parquet
        /ngen-workflow/data/superconus/hydrolocations/vpuid_${item.id}.parquet
        /ngen-workflow/data/superconus/v2.3/network/vpuid_${item.id}.parquet
        /ngen-workflow/output/v2.3/prepared/${item.id}
      deps:
        - ../../ngen-workflow/bash/prepare_reference_gpkg.sh
        - ../../ngen-workflow/data/superconus/v2.3/divides/vpuid_${item.id}.parquet
        - ../../ngen-workflow/data/superconus/v2.3/flowpaths/vpuid_${item.id}.parquet
        - ../../ngen-workflow/data/superconus/hydrolocations/vpuid_${item.id}.parquet
        - ../../ngen-workflow/data/superconus/v2.3/network/vpuid_${item.id}.parquet
      outs:
        - ../../ngen-workflow/output/v2.3/prepared/${item.id}/reference_hydrofabric.gpkg
  reference_corrections:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/run-topology-fix.sh
        /ngen-workflow/output/v2.3/prepared/${item.id}/reference_hydrofabric.gpkg
        /ngen-workflow/data/corrections/topology.csv
        /ngen-workflow/output/v2.3/corrections/${item.id}/reference_hydrofabric_fixed.gpkg
      deps:
        - ../../ngen-workflow/output/v2.3/prepared/${item.id}/reference_hydrofabric.gpkg
        - ../../ngen-workflow/bash/run-topology-fix.sh
        - ../../ngen-workflow/Python/topology_fix.py
        - ../../ngen-workflow/data/corrections/topology.csv
      outs:
        - ../../ngen-workflow/output/v2.3/corrections/${item.id}/reference_hydrofabric_fixed.gpkg
  build_fac_vrt:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric -lc
        "mkdir -p /ngen-workflow/output/v2.3/NHDSnapshot/FAC_vrt &&
        gdalbuildvrt
        /ngen-workflow/output/v2.3/NHDSnapshot/FAC_vrt/${item.prefix}_fac.vrt
        /ngen-workflow/data/NHDSnapshot/FAC/${item.prefix}/*"
      deps:
        - ../../ngen-workflow/data/NHDSnapshot/FAC/${item.prefix}/
      outs:
        - ../../ngen-workflow/output/v2.3/NHDSnapshot/FAC_vrt/${item.prefix}_fac.vrt
  build_fdr_vrt:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric -lc
        "mkdir -p /ngen-workflow/output/v2.3/NHDSnapshot/FDR_vrt &&
        gdalbuildvrt
        /ngen-workflow/output/v2.3/NHDSnapshot/FDR_vrt/${item.prefix}_fdr.vrt
        /ngen-workflow/data/NHDSnapshot/FDR/${item.prefix}/*"
      deps:
        - ../../ngen-workflow/data/NHDSnapshot/FDR/${item.prefix}/
      outs:
        - ../../ngen-workflow/output/v2.3/NHDSnapshot/FDR_vrt/${item.prefix}_fdr.vrt
  refactor:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/run-refactor.sh
        /ngen-workflow/output/v2.3/NHDSnapshot/FAC_vrt/${item.prefix}_fac.vrt
        /ngen-workflow/output/v2.3/NHDSnapshot/FDR_vrt/${item.prefix}_fdr.vrt
        /ngen-workflow/output/v2.3/corrections/${item.id}/reference_hydrofabric_fixed.gpkg
        /ngen-workflow/output/v2.3/refactored/${item.id}/refactored_reference_hydrofabric.gpkg
        ${refactor.split_flines_meters}
        ${refactor.collapse_flines_meters}
        ${refactor.collapse_flines_main_meters}
        ${refactor.simplify_tolerance_meters}
      params:
        - refactor.split_flines_meters
        - refactor.collapse_flines_meters
        - refactor.collapse_flines_main_meters
        - refactor.simplify_tolerance_meters
      deps:
        - ../../ngen-workflow/bash/run-refactor.sh
        - ../../ngen-workflow/R/refactor.R
        - ../../ngen-workflow/output/v2.3/corrections/${item.id}/reference_hydrofabric_fixed.gpkg
        - ../../ngen-workflow/output/v2.3/NHDSnapshot/FAC_vrt/${item.prefix}_fac.vrt
        - ../../ngen-workflow/output/v2.3/NHDSnapshot/FDR_vrt/${item.prefix}_fdr.vrt
      outs:
        - ../../ngen-workflow/output/v2.3/refactored/${item.id}/refactored_reference_hydrofabric.gpkg
  aggregate:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/run-aggregate.sh
        /ngen-workflow/output/v2.3/refactored/${item.id}/refactored_reference_hydrofabric.gpkg
        /ngen-workflow/output/v2.3/aggregated/${item.id}/aggregate_outlets.gpkg
        /ngen-workflow/output/v2.3/aggregated/${item.id}/aggregate_distribution.gpkg
        ${aggregate.ideal_size_sqkm}
        ${aggregate.min_length_km}
        ${aggregate.min_area_sqkm}
      params:
        - aggregate.ideal_size_sqkm
        - aggregate.min_length_km
        - aggregate.min_area_sqkm
      deps:
        - ../../ngen-workflow/R/aggregate.Rmd
        - ../../ngen-workflow/output/v2.3/refactored/${item.id}/refactored_reference_hydrofabric.gpkg
      outs:
        - ../../ngen-workflow/output/v2.3/aggregated/${item.id}/aggregate_outlets.gpkg
        - ../../ngen-workflow/output/v2.3/aggregated/${item.id}/aggregate_distribution.gpkg
  hfngen:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/run-hfngen.sh
        /ngen-workflow/output/v2.3/aggregated/${item.id}/aggregate_distribution.gpkg
        /ngen-workflow/output/v2.3/refactored/${item.id}/refactored_reference_hydrofabric.gpkg
        /ngen-workflow/output/v2.3/ngen/${item.id}/ngen_hydrofabric.gpkg
      deps:
        - ../../ngen-workflow/R/hfngen.Rmd
        - ../../ngen-workflow/output/v2.3/aggregated/${item.id}/aggregate_distribution.gpkg
        - ../../ngen-workflow/output/v2.3/refactored/${item.id}/refactored_reference_hydrofabric.gpkg
      outs:
        - ../../ngen-workflow/output/v2.3/ngen/${item.id}/ngen_hydrofabric.gpkg
  minimal_attributes:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/run-minimal-attributes.sh
        /ngen-workflow/output/v2.3/ngen/${item.id}/ngen_hydrofabric.gpkg
        /ngen-workflow/data/superconus/gridded/ISLTYP.tif
        /ngen-workflow/data/superconus/gridded/IVGTYP.tif
        /ngen-workflow/data/superconus/derived/CONUS_imp_240.tif
        /ngen-workflow/data/superconus/tabular/nwm_gw_basins.parquet
        /ngen-workflow/data/superconus/tabular/riverml_channel_geometry_with_ahg.parquet
        /ngen-workflow/output/v2.3/ngen/${item.id}/${minimal_attributes.output_geopackage_name}

      deps:
        - ../../ngen-workflow/R/minimal_attributes.Rmd
        - ../../ngen-workflow/output/v2.3/ngen/${item.id}/ngen_hydrofabric.gpkg
        - ../../ngen-workflow/data/superconus/gridded/ISLTYP.tif
        - ../../ngen-workflow/data/superconus/gridded/IVGTYP.tif
        - ../../ngen-workflow/data/superconus/derived/CONUS_imp_240.tif
        - ../../ngen-workflow/data/superconus/tabular/nwm_gw_basins.parquet
        - ../../ngen-workflow/data/superconus/tabular/riverml_channel_geometry_with_ahg.parquet
      outs:
        - ../../ngen-workflow/output/v2.3/ngen/${item.id}/${minimal_attributes.output_geopackage_name}
  vaa:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/run-vaa.sh
        /ngen-workflow/output/v2.3/ngen/${item.id}/${minimal_attributes.output_geopackage_name}
        /ngen-workflow/data/superconus/gridded/soil/ 
        /ngen-workflow/data/superconus/tabular/nwm_gw_basins.parquet
        /ngen-workflow/data/NHDSnapshot/DEM/${item.prefix}/dem${item.prefix}.vrt
      deps:
        - ../../ngen-workflow/bash/run-vaa.sh
        - ../../ngen-workflow/R/vaa.Rmd
        - ../../ngen-workflow/output/v2.3/ngen/${item.id}/${minimal_attributes.output_geopackage_name}
        - ../../ngen-workflow/data/superconus/gridded/soil/
        - ../../ngen-workflow/data/superconus/tabular/nwm_gw_basins.parquet
        - ../../ngen-workflow/data/NHDSnapshot/DEM/${item.prefix}/
        - ../../ngen-workflow/data/NHDSnapshot/DEM/${item.prefix}/dem${item.prefix}.vrt
      outs:
#        - ../../ngen-workflow/data/ngen/v2.3/${item.id}/vaa_noahowp.parquet
        - ../../ngen-workflow/output/v2.3/ngen/${item.id}/ngen_hydrofabric_vaa.gpkg
  reconcile:
    foreach: ${vpuids}
    do:
      cmd: >
        docker compose run --rm hydrofabric ./bash/run-reconcile.sh
        /ngen-workflow/output/v2.3/ngen/${item.id}/${minimal_attributes.output_geopackage_name}
        ${item.id}
        /ngen-workflow/output/v2.3/ngen/${item.id}/${reconcile.output_geopackage_name}
      deps:
        - ../../ngen-workflow/R/reconcile.Rmd
        - ../../ngen-workflow/output/v2.3/ngen/${item.id}/${minimal_attributes.output_geopackage_name}
      outs:
        - ../../ngen-workflow/output/v2.3/ngen/${item.id}/${reconcile.output_geopackage_name}